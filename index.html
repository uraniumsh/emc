<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Metas para PWA e Instalación en Móvil -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">
    
    <!-- Enlace al archivo manifest externo para habilitar la instalación en Chrome -->
    <link rel="manifest" href="./manifest.json">
    
    <title>ECD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border-color: #30363d;
            --accent-green: #2ea44f;
            --accent-blue: #1f6beb;
            --accent-blue-light: #3fb950;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --danger: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100dvh;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (min-width: 480px) {
            .app-container {
                max-width: 420px;
                height: 850px;
                position: relative;
                border-radius: 24px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.6);
                border: 1px solid var(--border-color);
            }
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-badge {
            background: var(--accent-blue);
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            padding: 3px 6px;
            border-radius: 5px;
            letter-spacing: 1px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Info Bar */
        .info-bar {
            padding: 8px 14px;
            background: #11161d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item small {
            color: var(--text-secondary);
            font-size: 9px;
            font-weight: 600;
            display: block;
        }

        .info-item span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Chart Section Fluida y Adaptable */
        .chart-section {
            flex: 1; /* Ocupa exactamente el espacio disponible de manera proporcional */
            min-height: 140px;
            position: relative;
            background: var(--bg-main);
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
        }

        .timeframes {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .tf-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tf-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .chart-container {
            flex: 1;
            position: relative;
            width: 100%;
        }

        /* Conversion Panel */
        .conversion-panel {
            background: var(--bg-card);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selectors-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .currency-select-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .currency-select-group label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .select-wrapper {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 6px;
        }

        .select-wrapper select {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .swap-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 12px;
        }

        .inputs-row {
            display: flex;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .input-box label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 600;
            display: block;
            margin-bottom: 1px;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            outline: none;
        }

        .presets {
            display: flex;
            gap: 4px;
        }

        .preset-btn {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 0;
            font-size: 10px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Bottom Action Bar (50/50 Split) */
        .bottom-action-bar {
            display: flex;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            height: 52px;
        }

        .bottom-action-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .bottom-action-btn:active {
            background: var(--bg-input);
        }

        .bottom-action-btn:first-child {
            border-right: 1px solid var(--border-color);
        }

        /* Bottom Sheet Menu */
        .bottom-sheet-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 40%;
            background: var(--bg-card);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-top: 1px solid var(--border-color);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 101;
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            bottom: 0;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .sheet-title {
            font-size: 13px;
            font-weight: 700;
        }

        .sheet-menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-item span {
            font-size: 12px;
            font-weight: 600;
        }

        /* Modal Compra/Venta */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 200;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .modal-header h3 {
            font-size: 13px;
            font-weight: 700;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-field label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-field input, .form-field select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 7px 9px;
            color: var(--text-primary);
            font-size: 11px;
            outline: none;
        }

        .btn-submit {
            background: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>

<script>
    let rawRate = 1;
    let chartInstance = null;
    let currentTf = '1D';

    function formatDynamic(val) {
        if (val === 0) return "0.00";
        const absVal = Math.abs(val);
        if (absVal < 0.01) {
            const decimals = Math.min(Math.max(Math.ceil(-Math.log10(absVal)) + 2, 4), 6);
            return val.toFixed(decimals);
        }
        return val.toFixed(2);
    }

    const ctx = document.getElementById('mainChart').getContext('2d');

    const crosshairPlugin = {
        id: 'crosshair',
        afterDraw: (chart) => {
            if (chart.tooltip?._active && chart.tooltip._active.length) {
                const activePoint = chart.tooltip._active[0];
                const { ctx } = chart;
                const x = activePoint.element.x;
                const y = activePoint.element.y;
                const topY = chart.scales.y.top;
                const bottomY = chart.scales.y.bottom;
                const leftX = chart.scales.x.left;
                const rightX = chart.scales.x.right;

                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([2, 2]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#8b949e';

                ctx.moveTo(x, topY);
                ctx.lineTo(x, bottomY);
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
                ctx.restore();
            }
        }
    };

    function renderChart(labels, dataPoints) {
        if (chartInstance) chartInstance.destroy();

        const minVal = Math.min(...dataPoints);
        const maxVal = Math.max(...dataPoints);
        const padding = (maxVal - minVal) * 0.1 || 0.01;

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: dataPoints,
                    borderColor: '#2ea44f',
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    pointHoverBackgroundColor: '#3fb950',
                    fill: true,
                    backgroundColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return null;
                        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                        gradient.addColorStop(0, 'rgba(46, 164, 79, 0.25)');
                        gradient.addColorStop(1, 'rgba(46, 164, 79, 0.0)');
                        return gradient;
                    },
                    tension: 0.15
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#161b22',
                        titleColor: '#8b949e',
                        bodyColor: '#f0f6fc',
                        borderColor: '#30363d',
                        borderWidth: 1,
                        padding: 6,
                        displayColors: false,
                        callbacks: {
                            label: (context) => ` Tasa: ${formatDynamic(context.raw)}`
                        }
                    }
                },
                scales: {
                    x: { 
                        grid: { display: false }, 
                        ticks: { color: '#8b949e', font: { size: 8 }, maxTicksLimit: 6 } 
                    },
                    y: { 
                        min: parseFloat((minVal - padding).toFixed(4)),
                        max: parseFloat((maxVal + padding).toFixed(4)),
                        grid: { color: '#21262d' }, 
                        ticks: { 
                            color: '#8b949e', 
                            font: { size: 8 }, 
                            maxTicksLimit: 5, 
                            callback: (v) => formatDynamic(v) 
                        } 
                    }
                }
            },
            plugins: [crosshairPlugin]
        });
    }

        async function fetchRates() {
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;

        try {
            // Usamos base USD como pivote universal para calcular cualquier cruce perfectamente
            const res = await fetch(`https://open.er-api.com/v6/latest/USD`);
            const data = await res.json();
            
            if (data && data.rates) {
                let rates = data.rates;

                // 1. Ajuste COP (Nuevo Peso: 1,000 COP tradicionales = 1.00 COP)
                rates['COP'] = rates['COP'] / 1000;

                // ==========================================
                // 2. AQUÍ PONES TUS MONEDAS INVENTADAS:
                // ==========================================
                rates['ESP'] = 0.93;        // 1 Dólar = 10.00 ECD
                //rates['MND'] = 00.00;       // 1 Dólar = 50.50 de tu otra moneda inventada
                // ==========================================

                const rateFromUSD = rates[from] || 1;
                const rateToUSD = rates[to] || 1;

                rawRate = rateToUSD / rateFromUSD;

                document.getElementById('rateSummary').innerText = `1 ${from} = ${formatDynamic(rawRate)} ${to}`;
                convert();
                generateRealHistory();
            }
        } catch (e) {
            document.getElementById('rateSummary').innerText = `1 ${from} = ${formatDynamic(rawRate)} ${to}`;
        }
    }

    function generateRealHistory() {
        let count = currentTf === '1D' ? 24 : currentTf === '1W' ? 7 : currentTf === '1M' ? 30 : 12;
        let labels = [];
        let points = [];
        let base = rawRate;

        for (let i = count; i >= 0; i--) {
            labels.push(currentTf === '1D' ? `${i}:00` : currentTf === '1Y' ? `M-${i}` : `D-${i}`);
            let smoothFactor = Math.cos(i / 3) * (rawRate * 0.003);
            let val = base + smoothFactor;
            points.push(parseFloat(Number(val).toFixed(6)));
        }
        renderChart(labels, points);
    }

    function convert() {
        const val = parseFloat(document.getElementById('inputAmount').value) || 0;
        const result = val * rawRate;
        document.getElementById('outputResult').value = formatDynamic(result);
    }

    function setAmount(v) {
        document.getElementById('inputAmount').value = v;
        convert();
    }

    function onCurrencyChange() {
        fetchRates();
    }

    function swapCurrencies() {
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        fetchRates();
    }

    function setTf(tf, btn) {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTf = tf;
        generateRealHistory();
    }

    function toggleBottomSheet() {
        document.getElementById('bottomSheetOverlay').classList.toggle('active');
    }

    function closeBottomSheet(e) {
        if (e.target.id === 'bottomSheetOverlay') {
            toggleBottomSheet();
        }
    }

    function openDepositModal() {
        toggleBottomSheet();
        document.getElementById('depositModal').classList.add('active');
    }

    function closeDepositModal() {
        document.getElementById('depositModal').classList.remove('active');
    }

    function submitDeposit() {
        alert('Solicitud enviada correctamente. Se procesará el depósito/transferencia a la cuenta asociada.');
        closeDepositModal();
    }

    // Registro de Service Worker para PWA instalable
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    fetchRates();
</script>

</body>
</html>
