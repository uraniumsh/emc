<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emc | Editor e Intérprete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="emc.js" defer></script>
</head>
<body>

    <header class="topbar">
        <div class="logo">emc<span>_lang</span></div>
        <div class="top-actions">
            <span class="badge-ok">ENTORNO ACTIVO</span>
        </div>
    </header>

    <main class="container">
        <div id="emcEnvironment" class="neo-card full-width-card">
            
            <div class="section-header flex-between">
                <h2 class="title-font accent-text">EDITOR .emc</h2>
                <div style="display:flex; gap:10px;">
                    <button id="btnRunCode" class="neo-btn-sm success" style="background: var(--success); color: #000;">▶ EJECUTAR</button>
                    <button id="btnClearCode" class="neo-btn-sm danger">🗑️ LIMPIAR</button>
                </div>
            </div>
            
            <div id="codeEditorContainer">
                <div id="lineNumbers">1</div>
                <div class="editor-wrapper">
                    <div id="codeHighlighting" aria-hidden="true"></div>
                    <textarea id="codeEditor" spellcheck="false" wrap="off"></textarea>
                </div>
            </div>

            <div class="neo-divider mt-20 mb-20"></div>

            <div class="section-header flex-between">
                <h2 class="title-font accent-text">TERMINAL</h2>
                <button id="btnClearConsole" class="neo-btn-sm warning">🧹 LIMPIAR TERMINAL</button>
            </div>
            <div id="terminalOutput" class="terminal-box">
                <div class="terminal-line system-msg">>> emc_lang v1.0.0 cargado.</div>
                <div class="terminal-line system-msg">>> Compilador listo. Esperando instrucciones...</div>
            </div>
            
        </div>
    </main>

</body>
</html>
